<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MoneyMate — Personal Finance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="static/css/style.css" rel="stylesheet">
</head>
<body>

<!-- ─── Sidebar ─────────────────────────────────────────────── -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">💰</span>
    <span class="brand-text">MoneyMate</span>
  </div>

  <nav class="sidebar-nav">
    <a href="#dashboard" class="nav-link" data-page="dashboard">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>
    <a href="#statements" class="nav-link" data-page="statements">
      <i class="bi bi-file-earmark-text"></i>
      <span>Bank Statements</span>
    </a>
    <a href="#transactions" class="nav-link" data-page="transactions">
      <i class="bi bi-arrow-left-right"></i>
      <span>Transactions</span>
    </a>
    <a href="#budget" class="nav-link" data-page="budget">
      <i class="bi bi-pie-chart"></i>
      <span>Budget &amp; Analysis</span>
    </a>
    <a href="#goals" class="nav-link" data-page="goals">
      <i class="bi bi-trophy"></i>
      <span>Goals</span>
    </a>
    <a href="#cashflow" class="nav-link" data-page="cashflow">
      <i class="bi bi-graph-up-arrow"></i>
      <span>Cash Flow Planner</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="#profile" class="nav-link" data-page="profile">
      <i class="bi bi-person-circle"></i>
      <span>Profile</span>
    </a>
  </div>
</div>

<!-- ─── Main Content ─────────────────────────────────────────── -->
<div class="main-content" id="main-content">

  <!-- Topbar -->
  <div class="topbar">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted d-none d-sm-inline" id="topbar-date" style="font-size:13px;"></span>
      <div class="avatar-circle" id="topbar-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
    </div>
  </div>

  <!-- Page Container -->
  <div class="page-content">
    <div id="app">
      <div class="page-loading text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <p class="mt-3 text-muted">Initialising MoneyMate…</p>
      </div>
    </div>
  </div>

</div>

<!-- ─── Toast container ──────────────────────────────────────── -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index:9999;"></div>

<!-- ─── CDN Scripts ──────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

<!-- ─── App Scripts ──────────────────────────────────────────── -->
<script src="static/js/db.js"></script>
<script src="static/js/parser.js"></script>
<script src="static/js/app.js"></script>

</body>
</html>
