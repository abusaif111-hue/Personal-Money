name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-finance-app-gLo7V]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/static/css _site/static/js
          cp index.html _site/
          cp bundle.html _site/
          cp static/css/style.css _site/static/css/
          cp static/js/app.js _site/static/js/
          cp static/js/db.js _site/static/js/
          cp static/js/parser.js _site/static/js/
          touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
